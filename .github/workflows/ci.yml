name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Scaffolded projects get their bun.lock on first install — fall back to a
      # plain install when the lockfile isn't committed yet
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint (Biome)
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Smoke test
        run: bun run test
