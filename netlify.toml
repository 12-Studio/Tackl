# Netlify config for Next.js
# The Next.js plugin runs after build and deploys the app via serverless/edge.
# In Netlify UI: Build & deploy → Build settings → Publish directory must be EMPTY.

[build]
  command = "bun run build"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"


# NOTE • Informational only — it audits the build output as static files, not
# the running Next.js server, so its scores can differ from the real site
# (e.g. Best Practices 92 for a site that scores 100). The 100-or-fail gate
# is Lighthouse CI in GitHub Actions — see docs/Lighthouse.md.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs.settings]
    preset = "desktop"
