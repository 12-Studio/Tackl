name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # A real site URL so robots and canonical metadata render as in
      # production — without one the site is deliberately noindex
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # Scaffolded projects get their bun.lock on first install — fall back to a
      # plain install when the lockfile isn't committed yet
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      # Generated from the TS tokens — fails if src/theme changed without
      # running `bun run styles`
      - name: Check generated styles
        run: bun run styles --check

      - name: Lint (Biome + Stylelint)
        run: bun run lint

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Smoke test
        run: bun run test

      # Fails below the floor in lighthouserc.js (Performance and Best Practices
      # 90+, SEO 100, every Agentic Browsing check passing)
      - name: Lighthouse
        run: bunx lhci autorun
